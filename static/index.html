<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMax 流式 TTS API 测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #1a1a2e;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            min-height: 120px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        select, input[type="range"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        .range-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        input[type="range"] {
            flex: 1;
            padding: 0;
            border: none;
            -webkit-appearance: none;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
        }
        .range-value {
            min-width: 50px;
            text-align: center;
            font-weight: 600;
            color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .audio-container {
            margin-top: 30px;
            text-align: center;
            display: none;
        }
        audio {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            color: #e74c3c;
            background: #fdeaea;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .voice-info {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .voice-select-container {
            display: flex;
            justify-content: space-between;
        }
        .api-example {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 30px;
            font-family: monospace;
            font-size: 14px;
            overflow-x: auto;
        }
        .api-example code {
            color: #333;
        }
        .text-tags-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .pause-hint {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }
        .pause-hint code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
        .pause-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag-btn {
            padding: 6px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .tag-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MiniMax 流式 TTS API</h1>

        <div class="form-group">
            <label for="text">输入文本</label>
            <textarea id="text" placeholder="请输入要转换的文本...">欢迎使用 MiniMax 流式文字转语音服务，这项技术可以让您的文字以自然的声音朗读出来。</textarea>
            <div style="margin-top: 8px; text-align: right;">
                <button type="button" class="tag-btn" onclick="toggleTextTags()" style="font-size: 11px; padding: 4px 10px;">高级标签 ▾</button>
            </div>
        </div>

        <div class="form-group">
            <label>选择音色</label>
            <div class="voice-select-container">
                <select id="languageSelect" onchange="onLanguageChange()" style="width: 48%; margin-right: 4%;">
                    <option value="">选择语言</option>
                </select>
                <select id="voice" style="width: 48%;">
                    <option value="">请先选择语言</option>
                </select>
            </div>
            <div class="voice-info" id="voiceInfo">共 0 个可用音色</div>
        </div>

        <div class="form-group">
            <label>语速</label>
            <div class="range-container">
                <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
                <span class="range-value" id="speedValue">1.0x</span>
            </div>
        </div>

        <div class="form-group">
            <label>音量</label>
            <div class="range-container">
                <input type="range" id="volume" min="0" max="2" step="0.1" value="1">
                <span class="range-value" id="volumeValue">1.0</span>
            </div>
        </div>

        <div class="form-group">
            <label>语调</label>
            <div class="range-container">
                <input type="range" id="pitch" min="-12" max="12" step="1" value="0">
                <span class="range-value" id="pitchValue">0</span>
            </div>
        </div>

        <div class="form-group">
            <label for="model">模型选择</label>
            <select id="model" style="width: 100%;">
                <option value="speech-2.8-hd" selected>Speech 2.8 HD (最新旗舰音质)</option>
                <option value="speech-2.8-turbo">Speech 2.8 Turbo (最新低时延)</option>
                <option value="speech-2.6-hd">Speech 2.6 HD (极致音质)</option>
                <option value="speech-2.6-turbo">Speech 2.6 Turbo (超低时延)</option>
                <option value="speech-02-hd">Speech 02 HD (稳定性好)</option>
                <option value="speech-02-turbo">Speech 02 Turbo (性能出色)</option>
                <option value="speech-01-hd">Speech 01 HD (经典版本)</option>
                <option value="speech-01-turbo">Speech 01 Turbo (经典快速版)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="emotion">情绪控制</label>
            <select id="emotion" style="width: 100%;">
                <option value="auto">自动识别</option>
                <option value="happy">开心</option>
                <option value="sad">悲伤</option>
                <option value="angry">愤怒</option>
                <option value="fear">恐惧</option>
                <option value="disgust">厌恶</option>
                <option value="surprise">惊讶</option>
                <option value="neutral">中性</option>
                <option value="lively">生动</option>
                <option value="whisper">低语</option>
            </select>
            <div class="voice-info" style="font-size: 11px; color: #999;">注：生动/低语仅对部分模型生效</div>
        </div>

        <div class="form-group">
            <label for="audioFormat">音频格式</label>
            <select id="audioFormat" style="width: 100%;">
                <option value="mp3" selected>MP3</option>
                <option value="wav">WAV</option>
                <option value="pcm">PCM</option>
            </select>
        </div>

        <div class="form-group">
            <label for="customVoiceId">自定义音色ID（可选）</label>
            <input type="text" id="customVoiceId" placeholder="留空使用下拉选择的音色" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
        </div>

        <button class="btn" id="generateBtn" onclick="generateAudio()">生成音频</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">正在生成音频...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="audio-container" id="audioContainer">
            <label>生成的音频</label>
            <audio id="audioPlayer" controls></audio>
        </div>

        <div class="api-example">
            <strong>API 调用示例：</strong><br><br>
            <code>POST /tts/stream</code><br>
            <code>GET /tts/stream?text=你好&voice=female-shaonv-jingpin&speed=1.0</code>
        </div>

        <div class="text-tags-section" id="textTagsSection">
            <label style="margin-top: 10px;">文本标签</label>
            <div class="pause-hint">停顿控制：使用 <code>&lt;#x#&gt;</code> 标记停顿时长（秒）</div>
            <div class="pause-input-row">
                <input type="number" id="pauseSeconds" min="0.1" max="10" step="0.1" value="0.5" style="width: 80px; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                <span style="color: #666;">秒</span>
                <button type="button" class="tag-btn" onclick="insertPauseTag()">插入停顿</button>
            </div>
            <div class="tags-container">
                <button type="button" class="tag-btn" onclick="insertSoundEffect('笑声')">笑声</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('轻笑')">轻笑</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('咳嗽')">咳嗽</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('清嗓子')">清嗓子</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('呻吟')">呻吟</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('换气')">换气</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('喘气')">喘气</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('吸气')">吸气</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('呼气')">呼气</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('倒吸气')">倒吸气</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('吸鼻子')">吸鼻子</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('叹气')">叹气</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('喷鼻息')">喷鼻息</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('打嗝')">打嗝</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('咂嘴')">咂嘴</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('哼唱')">哼唱</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('嘶嘶声')">嘶嘶声</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('嗯')">嗯</button>
                <button type="button" class="tag-btn" onclick="insertSoundEffect('喷嚏')">喷嚏</button>
            </div>
        </div>
    </div>

    <script>
        const speedInput = document.getElementById('speed');
        const volumeInput = document.getElementById('volume');
        const pitchInput = document.getElementById('pitch');
        const speedValue = document.getElementById('speedValue');
        const volumeValue = document.getElementById('volumeValue');
        const pitchValue = document.getElementById('pitchValue');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const audioContainer = document.getElementById('audioContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const errorDiv = document.getElementById('error');
        const languageSelect = document.getElementById('languageSelect');
        const voiceSelect = document.getElementById('voice');
        const voiceInfo = document.getElementById('voiceInfo');

        let allVoices = [];
        let voicesByLanguage = {};

        // 页面加载时获取音色列表
        async function loadVoices() {
            try {
                const response = await fetch('/voices');
                const data = await response.json();
                allVoices = data.voices || [];

                // 按语言分组
                voicesByLanguage = {};
                allVoices.forEach(v => {
                    const lang = v.language || '未知';
                    if (!voicesByLanguage[lang]) {
                        voicesByLanguage[lang] = [];
                    }
                    voicesByLanguage[lang].push(v);
                });

                // 填充语言下拉菜单
                const languages = Object.keys(voicesByLanguage).sort();
                languageSelect.innerHTML = '<option value="">选择语言</option>';
                let defaultLangSelected = false;
                languages.forEach(lang => {
                    const option = document.createElement('option');
                    option.value = lang;
                    option.textContent = `${lang} (${voicesByLanguage[lang].length})`;
                    languageSelect.appendChild(option);
                    // 默认选中中文
                    if (lang === '中文' && !defaultLangSelected) {
                        languageSelect.value = lang;
                        defaultLangSelected = true;
                    }
                });

                // 如果有中文，自动加载中文音色列表
                if (defaultLangSelected) {
                    onLanguageChange();
                }

                voiceInfo.textContent = `共 ${allVoices.length} 个可用音色，${languages.length} 种语言`;
            } catch (err) {
                voiceInfo.textContent = '音色加载失败，请刷新重试';
            }
        }

        // 语言选择变化时更新音色列表
        function onLanguageChange() {
            const selectedLang = languageSelect.value;
            voiceSelect.innerHTML = '';

            if (!selectedLang) {
                voiceSelect.innerHTML = '<option value="">请先选择语言</option>';
                voiceInfo.textContent = `共 ${allVoices.length} 个可用音色`;
                return;
            }

            const voices = voicesByLanguage[selectedLang] || [];
            voices.forEach(v => {
                const option = document.createElement('option');
                option.value = v.id;
                // 格式：名称 - 描述（如有）
                const desc = v.description || '';
                option.textContent = desc ? `${v.name} - ${desc}` : v.name;
                option.dataset.description = desc;
                option.dataset.name = v.name;
                voiceSelect.appendChild(option);
            });

            voiceInfo.textContent = `${selectedLang} 共有 ${voices.length} 个音色`;

            // 显示选中音色的描述
            if (voices.length > 0) {
                const firstVoice = voices[0];
                voiceInfo.textContent = firstVoice.description || firstVoice.name;
            }
        }

        // 音色选择变化时显示详情
        voiceSelect.addEventListener('change', () => {
            const selected = voiceSelect.options[voiceSelect.selectedIndex];
            if (selected) {
                const desc = selected.dataset.description;
                const name = selected.dataset.name;
                voiceInfo.textContent = desc || name || '';
            }
        });

        speedInput.addEventListener('input', () => speedValue.textContent = speedInput.value + 'x');
        volumeInput.addEventListener('input', () => volumeValue.textContent = volumeInput.value);
        pitchInput.addEventListener('input', () => pitchValue.textContent = pitchInput.value);

        // 页面加载时获取音色
        loadVoices();

        async function generateAudio() {
            const text = document.getElementById('text').value.trim();
            const voice = document.getElementById('voice').value;
            const speed = speedInput.value;
            const volume = volumeInput.value;
            const pitch = pitchInput.value;
            const model = document.getElementById('model').value;
            const emotion = document.getElementById('emotion').value;
            const audioFormat = document.getElementById('audioFormat').value;
            const customVoiceId = document.getElementById('customVoiceId').value.trim();

            if (!text) {
                showError('请输入要转换的文本');
                return;
            }

            if (text.length > 1000) {
                showError('文本过长，请控制在1000字以内');
                return;
            }

            generateBtn.disabled = true;
            loading.style.display = 'block';
            errorDiv.style.display = 'none';
            audioContainer.style.display = 'none';

            // 停止之前的播放
            audioPlayer.pause();
            audioPlayer.currentTime = 0;

            try {
                const params = new URLSearchParams({
                    text: text,
                    voice: voice,
                    speed: speed,
                    volume: volume,
                    pitch: pitch,
                    model: model,
                    audio_format: audioFormat
                });

                // 添加可选参数
                if (emotion && emotion !== 'auto') {
                    params.append('emotion', emotion);
                }
                if (customVoiceId) {
                    params.append('custom_voice_id', customVoiceId);
                }

                audioPlayer.src = `/tts/stream?${params.toString()}`;
                audioPlayer.load();
                audioContainer.style.display = 'block';
            } catch (err) {
                showError('生成音频失败: ' + err.message);
            } finally {
                generateBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // 在光标位置插入文本
        function insertAtCursor(textarea, text) {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const before = textarea.value.substring(0, start);
            const after = textarea.value.substring(end);
            textarea.value = before + text + after;
            // 设置光标位置在插入文本之后
            textarea.selectionStart = textarea.selectionEnd = start + text.length;
            textarea.focus();
        }

        // 插入停顿标签
        function insertPauseTag() {
            const textarea = document.getElementById('text');
            const seconds = document.getElementById('pauseSeconds').value;
            const tag = `<#${seconds}#>`;
            insertAtCursor(textarea, tag);
        }

        // 插入语气词标签
        function insertSoundEffect(effect) {
            const textarea = document.getElementById('text');
            const tag = `<${effect}>`;
            insertAtCursor(textarea, tag);
        }
    </script>
</body>
</html>
