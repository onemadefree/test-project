<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMax 流式 TTS API 测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #1a1a2e;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            min-height: 120px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        select, input[type="range"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        .range-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        input[type="range"] {
            flex: 1;
            padding: 0;
            border: none;
            -webkit-appearance: none;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
        }
        .range-value {
            min-width: 50px;
            text-align: center;
            font-weight: 600;
            color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .audio-container {
            margin-top: 30px;
            text-align: center;
            display: none;
        }
        audio {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            color: #e74c3c;
            background: #fdeaea;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .voice-info {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .api-example {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 30px;
            font-family: monospace;
            font-size: 14px;
            overflow-x: auto;
        }
        .api-example code {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MiniMax 流式 TTS API</h1>

        <div class="form-group">
            <label for="text">输入文本</label>
            <textarea id="text" placeholder="请输入要转换的文本...">欢迎使用 MiniMax 流式文字转语音服务，这项技术可以让您的文字以自然的声音朗读出来。</textarea>
        </div>

        <div class="form-group">
            <label for="voice">选择音色</label>
            <input type="text" id="voiceSearch" placeholder="搜索音色..." oninput="filterVoices()" style="width: 100%; padding: 8px; margin-bottom: 5px; border: 1px solid #ddd; border-radius: 4px;">
            <select id="voice" size="10" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; background: white;">
            </select>
            <div class="voice-info" id="voiceInfo">加载中...</div>
        </div>

        <div class="form-group">
            <label>语速</label>
            <div class="range-container">
                <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
                <span class="range-value" id="speedValue">1.0x</span>
            </div>
        </div>

        <div class="form-group">
            <label>音量</label>
            <div class="range-container">
                <input type="range" id="volume" min="0" max="2" step="0.1" value="1">
                <span class="range-value" id="volumeValue">1.0</span>
            </div>
        </div>

        <div class="form-group">
            <label>语调</label>
            <div class="range-container">
                <input type="range" id="pitch" min="-12" max="12" step="1" value="0">
                <span class="range-value" id="pitchValue">0</span>
            </div>
        </div>

        <button class="btn" id="generateBtn" onclick="generateAudio()">生成音频</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">正在生成音频...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="audio-container" id="audioContainer">
            <label>生成的音频</label>
            <audio id="audioPlayer" controls></audio>
        </div>

        <div class="api-example">
            <strong>API 调用示例：</strong><br><br>
            <code>POST /tts/stream</code><br>
            <code>GET /tts/stream?text=你好&voice=female-shaonv-jingpin&speed=1.0</code>
        </div>
    </div>

    <script>
        const speedInput = document.getElementById('speed');
        const volumeInput = document.getElementById('volume');
        const pitchInput = document.getElementById('pitch');
        const speedValue = document.getElementById('speedValue');
        const volumeValue = document.getElementById('volumeValue');
        const pitchValue = document.getElementById('pitchValue');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const audioContainer = document.getElementById('audioContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const errorDiv = document.getElementById('error');
        const voiceSelect = document.getElementById('voice');
        const voiceInfo = document.getElementById('voiceInfo');

        let allVoices = [];

        // 页面加载时获取音色列表
        async function loadVoices() {
            try {
                const response = await fetch('/voices');
                const data = await response.json();
                allVoices = data.voices || [];
                renderVoices(allVoices);
                voiceInfo.textContent = `共 ${allVoices.length} 个可用音色`;
            } catch (err) {
                voiceInfo.textContent = '音色加载失败，使用默认音色';
            }
        }

        // 渲染音色列表
        function renderVoices(voices) {
            voiceSelect.innerHTML = '';
            voices.forEach(v => {
                const option = document.createElement('option');
                option.value = v.id;
                option.textContent = `${v.name} (${v.language})`;
                option.dataset.name = v.name;
                option.dataset.language = v.language;
                option.dataset.description = v.description || '';
                voiceSelect.appendChild(option);
            });

            // 选中第一个
            if (voiceSelect.options.length > 0) {
                voiceSelect.selectedIndex = 0;
                updateVoiceInfo();
            }
        }

        // 更新音色信息显示
        function updateVoiceInfo() {
            const selected = voiceSelect.options[voiceSelect.selectedIndex];
            if (selected) {
                const desc = selected.dataset.description;
                voiceInfo.textContent = desc ? desc : selected.dataset.language;
            }
        }

        // 搜索过滤音色
        function filterVoices() {
            const searchText = document.getElementById('voiceSearch').value.toLowerCase();
            if (!searchText) {
                renderVoices(allVoices);
                return;
            }
            const filtered = allVoices.filter(v =>
                v.name.toLowerCase().includes(searchText) ||
                v.id.toLowerCase().includes(searchText) ||
                v.language.toLowerCase().includes(searchText)
            );
            renderVoices(filtered);
        }

        // 音色选择变化时显示详情
        voiceSelect.addEventListener('change', updateVoiceInfo);

        speedInput.addEventListener('input', () => speedValue.textContent = speedInput.value + 'x');
        volumeInput.addEventListener('input', () => volumeValue.textContent = volumeInput.value);
        pitchInput.addEventListener('input', () => pitchValue.textContent = pitchInput.value);

        // 页面加载时获取音色
        loadVoices();

        async function generateAudio() {
            const text = document.getElementById('text').value.trim();
            const voice = document.getElementById('voice').value;
            const speed = speedInput.value;
            const volume = volumeInput.value;
            const pitch = pitchInput.value;

            if (!text) {
                showError('请输入要转换的文本');
                return;
            }

            if (text.length > 1000) {
                showError('文本过长，请控制在1000字以内');
                return;
            }

            generateBtn.disabled = true;
            loading.style.display = 'block';
            errorDiv.style.display = 'none';
            audioContainer.style.display = 'none';

            // 停止之前的播放
            audioPlayer.pause();
            audioPlayer.currentTime = 0;

            try {
                const params = new URLSearchParams({
                    text: text,
                    voice: voice,
                    speed: speed,
                    volume: volume,
                    pitch: pitch
                });

                audioPlayer.src = `/tts/stream?${params.toString()}`;
                audioPlayer.load();
                audioContainer.style.display = 'block';
            } catch (err) {
                showError('生成音频失败: ' + err.message);
            } finally {
                generateBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
